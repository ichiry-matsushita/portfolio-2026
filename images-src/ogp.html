<!doctype html>
<!-- OGP画像（1200×630）の元。README の手順でブラウザから画像に書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    box-sizing: border-box; padding: 0 96px;
    background: #F5F6F8; color: #16191F;
    font-family: "Noto Sans JP", sans-serif;
  }
  .card {
    background: #fff; border: 2px solid #E3E6EB; border-radius: 24px;
    padding: 64px 72px;
  }
  .label { color: #1F5FD1; font: 600 22px/1.4 Inter, sans-serif; letter-spacing: .08em; }
  h1 { margin: 20px 0 0; font-size: 60px; line-height: 1.4; font-weight: 700; }
  .name { margin-top: 32px; color: #4B5563; font: 600 26px/1.4 Inter, "Noto Sans JP", sans-serif; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">WEB ENGINEER / OPERATIONS IMPROVEMENT</div>
    <h1>AI活用で、制作と運用を<br>効率化するWebエンジニア</h1>
    <div class="name">Portfolio</div>
  </div>
</body>
</html>
